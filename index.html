<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#294d3b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Forage" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
<title>Forage</title>
<style>
:root{--bg:#f6f3ec;--paper:#fffdf8;--ink:#1f2a24;--muted:#6c766f;--line:#ddd8ce;--accent:#315f49;--accent2:#a77645;--danger:#9d3e3e;--shadow:0 10px 30px rgba(50,50,40,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(221,216,206,.75)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:14px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#315f49,#a77645);display:grid;place-items:center;color:white;font-size:20px;box-shadow:var(--shadow)}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.8px;text-transform:uppercase}.balance{background:var(--paper);border:1px solid var(--line);padding:10px 14px;border-radius:14px;box-shadow:var(--shadow);font-weight:800;white-space:nowrap}.nav{display:flex;gap:8px;padding:0 20px 14px;overflow:auto}.nav button,.chip{border:1px solid var(--line);background:var(--paper);padding:10px 14px;border-radius:999px;color:var(--ink)}.nav button.active,.chip.active{background:var(--ink);color:white;border-color:var(--ink)}main{padding:20px}
.hero{background:linear-gradient(135deg,#294d3b 0%,#496d57 48%,#b47f4a 100%);color:white;border-radius:28px;padding:28px;display:grid;grid-template-columns:1.4fr .8fr;gap:22px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(34px,6vw,70px);line-height:.95;margin:0 0 16px}.hero p{max-width:650px;font-size:18px;line-height:1.5;opacity:.92}.hero-card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:20px;align-self:end}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 14px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:4px 0 0;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper)}.sort{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.photo{aspect-ratio:4/3;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#eae5db,#dfe9e2)}.photo::before{content:"";position:absolute;width:72%;height:72%;border-radius:48%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.92),rgba(255,255,255,.08));transform:rotate(var(--r,0deg))}.product-object{position:relative;z-index:1;font-size:66px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.16));transform:rotate(var(--r,0deg)) scale(1.05)}.photo-label{position:absolute;left:12px;bottom:10px;z-index:2;background:rgba(255,253,248,.86);backdrop-filter:blur(6px);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}.card-body{padding:15px;display:flex;flex-direction:column;gap:9px;flex:1}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800}.title{font-weight:850;font-size:18px;line-height:1.2}.desc{color:var(--muted);font-size:14px;line-height:1.4;min-height:40px}.rating{font-size:13px;color:#5a5147}.price-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}.price{font-weight:900}.old{text-decoration:line-through;color:var(--muted);font-size:12px;margin-left:6px}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#ece7df;color:#5a5147}.actions{display:flex;gap:8px}.primary,.secondary,.danger{border:0;border-radius:12px;padding:10px 12px}.primary{background:var(--ink);color:white}.secondary{background:#ece7df;color:var(--ink)}.danger{background:#f6dcdc;color:var(--danger)}.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;color:var(--muted)}
.detail{display:grid;grid-template-columns:1fr 1.05fr;gap:24px;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}.detail .photo{border-radius:20px;min-height:380px}.detail h1{font-size:38px;margin:8px 0}.detail p{color:var(--muted);line-height:1.6}.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.spec{border:1px solid var(--line);border-radius:14px;padding:12px}.selectors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.selectors label{display:block;font-size:12px;color:var(--muted);font-weight:700}.selectors select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.reviewbox{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.review{padding:12px 0;border-bottom:1px solid #ece7df}.review:last-child{border-bottom:0}.review strong{display:block}.cartline,.order{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.miniart{width:70px;height:70px;border-radius:14px;background:linear-gradient(145deg,#e9e1d5,#dfe9e2);display:grid;place-items:center;font-size:36px}.summary{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.summary-row{display:flex;justify-content:space-between;margin:9px 0}.summary-row.total{font-size:20px;font-weight:900;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.checkout-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.checkout-box label{display:block;font-size:13px;color:var(--muted)}.checkout-box select,.checkout-box input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}.stat strong{font-size:28px;display:block}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#b57a43;color:white;font-size:12px;margin-left:4px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1f2a24;color:white;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.pager{display:flex;justify-content:center;gap:8px;align-items:center;margin:22px 0}footer{padding:30px 20px;color:var(--muted);text-align:center}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:14px}.topbar{padding:12px 14px}.nav{padding:0 14px 12px}.grid{grid-template-columns:1fr;gap:12px}.hero{padding:22px;border-radius:22px}.checkout-box,.selectors{grid-template-columns:1fr}.detail h1{font-size:30px}.toolbar{grid-template-columns:1fr}}

.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label,.gift-box label{display:block;font-size:12px;color:var(--muted);font-weight:700}
.form-grid input,.form-grid textarea,.form-grid select,.gift-box input,.gift-box textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:11px;background:white;color:var(--ink)}
.form-grid textarea,.gift-box textarea{min-height:76px;resize:vertical}
.full{grid-column:1/-1}
.saved-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.saved-row small{display:block;color:var(--muted);margin-top:3px}
.gift-box{border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;background:#fbf8f2}
.checkrow{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--ink)}
.checkrow input{width:auto;margin:0}
@media(max-width:900px){.profile-grid{grid-template-columns:1fr}}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}


.market-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.market-note{border:1px solid var(--line);border-radius:15px;padding:12px;background:var(--paper)}
.market-note strong{display:block;font-size:14px}.market-note span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.discovery-badge{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:white;margin:0 5px 5px 0}
.stockline{font-size:12px;font-weight:800;margin-top:7px}
.review-card{border-top:1px solid var(--line);padding:14px 0}.review-head{display:flex;justify-content:space-between;gap:10px}
.verified{font-size:11px;font-weight:800;color:var(--accent)}
@media(max-width:760px){.market-strip{grid-template-columns:1fr 1fr}}

.photo.real-photo{background:none!important;border-radius:0!important;overflow:hidden!important;padding:0!important}
.photo.real-photo::before,.photo.real-photo::after{content:none!important;display:none!important}
.photo.real-photo img{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important;border-radius:0!important}


.size-link{border:0;background:none;color:var(--accent);padding:5px 0;font-weight:850;text-decoration:underline}.field-notes{margin:20px 0;border:1px solid var(--line);border-radius:18px;padding:18px;background:#fbf8f2}.field-notes .location{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--accent)}.field-notes h3{margin:5px 0 8px;font-family:Georgia,serif;font-size:23px}.field-notes p{margin:0;color:var(--ink)!important}.forage-aside{margin-top:12px;padding:12px 14px;border-left:3px solid var(--accent2);font-family:Georgia,serif;font-style:italic}.modalback{position:fixed;inset:0;background:rgba(20,25,22,.55);z-index:100;display:grid;place-items:center;padding:18px}.modal{background:var(--paper);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:22px;padding:20px}.size-table{width:100%;border-collapse:collapse}.size-table th,.size-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

.brand-home{display:inline-flex;align-items:center;border:0;background:transparent;padding:0;cursor:pointer;text-decoration:none}
.brand-home img{display:block;width:min(300px,48vw);height:auto;max-height:74px;object-fit:contain;object-position:left center}
@media(max-width:650px){.brand-home img{width:235px;max-height:64px}}

@media(min-width:850px){#nav .nav-spacer{margin-left:auto}}
</style>
</head>
<body>
<div class="app"><header><div class="topbar"><button class="brand-home" data-action="go-home" aria-label="Forage home"><img src="forage-logo.svg" alt="Forage — Hunt, Choose, Collect"></button><div class="balance" id="balanceBox"></div></div><div class="nav" id="nav"></div></header><main id="main"></main><footer>Forage uses fictional money only. No real checkout exists.</footer></div><div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
